name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Compilation
        run: dotnet build src/RavenneToolsMenu -c Release

      - name: Publication (fichier unique)
        run: dotnet publish src/RavenneToolsMenu -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Validation de la configuration
        run: ./publish/RavenneToolsMenu.exe --validate

      - name: Artifact portable
        uses: actions/upload-artifact@v4
        with:
          name: RavenneToolsMenu-portable
          path: publish/RavenneToolsMenu.exe
          if-no-files-found: error
